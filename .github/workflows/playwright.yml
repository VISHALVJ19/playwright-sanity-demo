name: Playwright Sanity Tests

on:
  push:
    branches: [main]
  # Validate changes before they reach main (PR from a feature branch).
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Fails the job if any mandatory test fails. Later steps use if: always()
      # so the summary and reports are still published.
      - name: Run sanity tests
        run: npm run test:sanity
        env:
          # Optional: set these in Settings > Secrets and variables > Actions.
          # When empty, tests fall back to the public demo / practice seed users.
          APP_USER: ${{ secrets.APP_USER }}
          APP_PASS: ${{ secrets.APP_PASS }}
          SAN_USER: ${{ secrets.SAN_USER }}
          SAN_PASS: ${{ secrets.SAN_PASS }}

      - name: Publish job summary
        if: always()
        run: node scripts/ci-summary.js reports/results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test evidence (screenshots, traces, videos, JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.run_number }}
          path: |
            test-results/
            reports/
          retention-days: 14
          if-no-files-found: warn

      # Runs last so the run link already has the artifacts. A channel without its
      # secrets is skipped; a send error is a warning and never changes the job result.
      - name: Send email and Teams notification
        if: always()
        run: node scripts/notify.js reports/results.json
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
